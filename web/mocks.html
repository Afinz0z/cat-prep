<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#1d4f91" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2b5ea8" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CAT prep">

  <link rel="icon" href="icons/icon-192.png">
  <script>try{var t=JSON.parse(localStorage.getItem("cat-theme"));if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;var z=JSON.parse(localStorage.getItem("cat-text"));if(z&&z!==100)document.documentElement.style.fontSize=z+"%";}catch(e){}</script>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header id="top" class="top-bar"></header>
  <main id="main" class="page"><p class="muted">Loading...</p></main>

</html>
