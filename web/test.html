<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https://zeeahagxvhldrcofdwob.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Practice test | CAT prep group</title>
  <meta name="theme-color" content="#2b3a4d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CAT prep">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <script src="js/early.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&family=Archivo:wdth,wght@62..125,500..800&display=swap">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/test.css">
</head>
<body class="exam">
  <header class="exam-bar">
    <div class="exam-title" id="testTitle">Loading the test</div>
    <div class="exam-tools">
      <button type="button" id="paperBtn" class="tool-btn" disabled>Question Paper</button>
      <button type="button" id="instrBtn" class="tool-btn">Instructions</button>
      <button type="button" id="calcBtn" class="tool-btn">Calculator</button>
      <button type="button" id="themeBtn" class="tool-btn" aria-pressed="false">Dark mode</button>
    </div>
  </header>
  <nav class="section-bar" aria-label="Sections">
    <ol id="sectionTabs" class="section-tabs"></ol>
    <div class="time-left">Time Left : <strong id="timeLeft">--:--</strong></div>
  </nav>
  <main id="main" class="exam-main"></main>
  <div id="calc" class="calc" hidden></div>
  <dialog id="dialog" class="dialog"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="js/test.js"></script>
</body>
</html>
